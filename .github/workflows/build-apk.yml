# Builds DocNest on GitHub's computers and publishes every build from main as a GitHub Release,
# which the app's update check reads. Also runs by hand from the Actions tab ("Run workflow").
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Lets the build save the signing key once, and publish releases.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Every release must be signed with the same key, or updates won't install over each other.
      # The first build makes the key, locked with the SIGNING_PASSWORD secret, and saves it in the
      # repository; later builds reuse it. Without that password the saved key is useless.
      - name: Get the signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Add the SIGNING_PASSWORD secret first (see README: Releases and updates)."
            exit 1
          fi
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -keystore app/release.keystore -storetype PKCS12 \
              -storepass:env SIGNING_PASSWORD -alias docnest -keyalg RSA -keysize 3072 \
              -validity 10000 -dname "CN=DocNest"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/release.keystore
            git commit -m "Add DocNest's signing key, locked with the SIGNING_PASSWORD secret"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # v5, not v6: v6 moved its caching into a closed-source part with separate terms of use.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3

      - name: Build the APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle assembleRelease -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk DocNest-1.${{ github.run_number }}.apk

      # Uploaded as the .apk itself, not a zip, so a phone can install it straight after downloading.
      - uses: actions/upload-artifact@v7
        with:
          path: DocNest-1.${{ github.run_number }}.apk
          archive: false

      # Tagged v1.<build number>: the app compares that number with its own version.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" "DocNest-1.${{ github.run_number }}.apk" \
            --title "DocNest 1.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s ${{ github.sha }})" \
            --target "${{ github.sha }}"
