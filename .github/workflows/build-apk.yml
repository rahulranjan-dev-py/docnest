# Builds DocNest on GitHub's computers and publishes every build from main as a GitHub Release,
# which the app's update check reads. Also runs by hand from the Actions tab ("Run workflow").
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Lets the build publish releases.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Every release must be signed with the same key, or updates won't install over each other.
      # The key lives only in the repository's secrets: KEYSTORE_BASE64 (the keystore file as text),
      # KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. A missing one stops the build rather than
      # letting it publish an APK signed with some other key.
      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name secret first (see README: Releases and updates)."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > app/release.keystore

      # v5, not v6: v6 moved its caching into a closed-source part with separate terms of use.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3

      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk DocNest-1.${{ github.run_number }}.apk

      # Uploaded as the .apk itself, not a zip, so a phone can install it straight after downloading.
      - uses: actions/upload-artifact@v7
        with:
          path: DocNest-1.${{ github.run_number }}.apk
          archive: false

      # Tagged v1.<build number>: the app compares that number with its own version.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" "DocNest-1.${{ github.run_number }}.apk" \
            --title "DocNest 1.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s ${{ github.sha }})" \
            --target "${{ github.sha }}"
