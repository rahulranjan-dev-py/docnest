# Builds the APK on GitHub's computers, so nothing needs installing on yours.
# Runs on every upload, or by hand from the Actions tab ("Run workflow").
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build the APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DocNest-apk
          path: app/build/outputs/apk/debug/app-debug.apk
