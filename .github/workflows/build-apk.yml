# Builds the APK on GitHub's computers, so nothing needs installing on yours.
# Runs on every upload, or by hand from the Actions tab ("Run workflow").
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  # Lets the first build save the signing key into the repository.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Every build must be signed with the same key, or a new APK won't install over the old one.
      # The first build makes the key and saves it in the repository; later builds reuse it.
      - name: Create the signing key (first build only)
        if: hashFiles('app/docnest-debug.keystore') == ''
        run: |
          keytool -genkeypair -keystore app/docnest-debug.keystore -storetype PKCS12 \
            -storepass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=DocNest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/docnest-debug.keystore
          git commit -m "Add the fixed signing key for DocNest builds"
          git push origin HEAD:${{ github.ref_name }}

      # v5, not v6: v6 moved its caching into a closed-source part with separate terms of use.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3

      - name: Build the APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DocNest.apk

      # Uploaded as the .apk itself, not a zip, so a phone can install it straight after downloading.
      - uses: actions/upload-artifact@v7
        with:
          path: DocNest.apk
          archive: false
